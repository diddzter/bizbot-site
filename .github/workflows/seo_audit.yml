name: Monthly SEO audit

on:
  schedule:
    - cron: "0 9 1 * *" # 1st of the month, 09:00 UTC
  workflow_dispatch:
    inputs:
      check_links:
        description: "Also check every tool's outbound link (slower)"
        type: boolean
        default: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt beautifulsoup4

      - name: Run audit
        working-directory: automation
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.check_links }}" != "false" ]; then
            ARGS="--check-links"
          fi
          python3 seo_audit.py $ARGS
