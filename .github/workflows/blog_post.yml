name: Publish weekly blog post

on:
  schedule:
    - cron: "0 9 * * 2" # every Tuesday 09:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write the post but don't publish it"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Generate and publish post
        working-directory: automation
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          python3 generate_blog_post.py $ARGS

      - name: Sweep for un-linked affiliate mentions (including the new post)
        if: github.event.inputs.dry_run != 'true'
        working-directory: automation
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_APP_USER: ${{ secrets.WP_APP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 affiliate_link_sweep.py
